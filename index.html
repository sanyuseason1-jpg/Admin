    // --- Format Helpers ---
    function formatUGX(amount) {
      if (amount === null || amount === undefined || isNaN(amount)) return '0 UGX';
      return new Intl.NumberFormat('en-UG', {
        style: 'decimal',
        maximumFractionDigits: 0,
      }).format(amount) + ' UGX';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleString('en-GB', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      } catch {
        return dateStr;
      }
    }

    function formatTimeAgo(dateStr) {
      if (!dateStr) return 'Never';
      try {
        const d = new Date(dateStr);
        const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
        if (diffSec < 60) return 'Just now';
        const diffMin = Math.floor(diffSec / 60);
        if (diffMin < 60) return `${diffMin}m ago`;
        const diffHours = Math.floor(diffMin / 60);
        if (diffHours < 24) return `${diffHours}h ago`;
        const diffDays = Math.floor(diffHours / 24);
        return `${diffDays}d ago`;
      } catch {
        return dateStr;
      }
    }

    function generateId() {
      return 'rec_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
    }

    // --- Direct TablesDB API Client (No cookies required) ---
    async function appwriteRequest(path, options = {}) {
      const url = `${APPWRITE_CONFIG.endpoint}${path}`;
      const headers = {
        'X-Appwrite-Project': APPWRITE_CONFIG.projectId,
        'X-Appwrite-Key': APPWRITE_CONFIG.apiKey,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const res = await fetch(url, { ...options, headers });
      if (!res.ok) {
        const errText = await res.text();
        let errMsg = `Appwrite request failed (${res.status})`;
        try {
          const parsed = JSON.parse(errText);
          if (parsed.message) errMsg = parsed.message;
        } catch {}
        throw new Error(errMsg);
      }
      return res.json();
    }

    const db = {
      async listRows(tableId) {
        const path = `/tablesdb/${APPWRITE_CONFIG.databaseId}/tables/${tableId}/rows?queries[0]={"method":"limit","values":[100]}`;
        const data = await appwriteRequest(path);
        return data.rows || [];
      },
      async getRow(tableId, rowId) {
        const path = `/tablesdb/${APPWRITE_CONFIG.databaseId}/tables/${tableId}/rows/${rowId}`;
        return appwriteRequest(path);
      },
      async updateRow(tableId, rowId, data) {
        const path = `/tablesdb/${APPWRITE_CONFIG.databaseId}/tables/${tableId}/rows/${rowId}`;
        return appwriteRequest(path, {
          method: 'PATCH',
          body: JSON.stringify({ data })
        });
      },
      async createRow(tableId, rowId, data) {
        const path = `/tablesdb/${APPWRITE_CONFIG.databaseId}/tables/${tableId}/rows`;
        return appwriteRequest(path, {
          method: 'POST',
          body: JSON.stringify({ rowId: rowId || generateId(), data })
        });
      }
    };

    // --- Main Application Component ---
    function AdminApp() {
      // Theme State (Default dark, saved in localStorage)
      const [theme, setTheme] = useState(() => localStorage.getItem('sanyu_admin_theme') || 'dark');
      useEffect(() => {
        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
        localStorage.setItem('sanyu_admin_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      // Auth State - No cookie checks, permanent in localStorage
      const [currentUser, setCurrentUser] = useState(() => {
        const stored = localStorage.getItem('sanyu_admin_user');
        return stored ? JSON.parse(stored) : ADMIN_ACCOUNT;
      });

      // Navigation: Exactly 8 sections in specified order
      const [activeSection, setActiveSection] = useState('dashboard');

      // Database Records
      const [deposits, setDeposits] = useState([]);
      const [withdrawals, setWithdrawals] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [commissions, setCommissions] = useState([]);
      const [recipients, setRecipients] = useState([]);
      const [groupLink, setGroupLink] = useState('');
      const [ledger, setLedger] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [toast, setToast] = useState(null);

      // Toast notification helper
      const showToast = (type, text) => {
        setToast({ type, text, id: Date.now() });
        setTimeout(() => setToast(null), 4000);
      };

      // Modal states
      const [editingWalletCustomer, setEditingWalletCustomer] = useState(null);
      const [walletType, setWalletType] = useState('add');
      const [walletAmount, setWalletAmount] = useState('');
      const [walletReason, setWalletReason] = useState('');
      const [isSavingWallet, setIsSavingWallet] = useState(false);

      const [editingGroupLink, setEditingGroupLink] = useState(false);
      const [newGroupLinkVal, setNewGroupLinkVal] = useState('');

      const [newRecipientModal, setNewRecipientModal] = useState(false);
      const [recipientName, setRecipientName] = useState('');
      const [recipientPhone, setRecipientPhone] = useState('');
      const [recipientNetwork, setRecipientNetwork] = useState('MTN');

      const [customerSearch, setCustomerSearch] = useState('');
      const [customerLocalSearch, setCustomerLocalSearch] = useState('');
      const [customerFilter, setCustomerFilter] = useState('all');

      const [ledgerSearch, setLedgerSearch] = useState('');
      const [ledgerLocalSearch, setLedgerLocalSearch] = useState('');
      const [ledgerTypeFilter, setLedgerTypeFilter] = useState('all');

      const [commissionSearch, setCommissionSearch] = useState('');

      // Master Data Loader - Direct Appwrite TablesDB
      const loadAllData = useCallback(async (quiet = false) => {
        if (!quiet) setIsRefreshing(true);
        try {
          const [
            rawProfiles,
            rawDeposits,
            rawWithdraws,
            rawCommissions,
            rawRecipients,
            rawSettings,
            rawLedger,
            rawClaims,
          ] = await Promise.all([
            db.listRows(APPWRITE_CONFIG.tables.PROFILES).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.DEPOSITS).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.WITHDRAWS).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.COMMISSIONS).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.PAYMENT_RECIPIENTS).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.APP_SETTINGS).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.LEDGER).catch(() => []),
            db.listRows(APPWRITE_CONFIG.tables.DAILY_CLAIMS).catch(() => []),
          ]);

          // Profile maps for resolving parent usernames
          const profileMap = new Map();
          const profileByCode = new Map();
          const profileByName = new Map();
          for (const p of rawProfiles) {
            profileMap.set(p.$id, p);
            if (p.referralcode) profileByCode.set(p.referralcode.trim().toLowerCase(), p);
            if (p.username) profileByName.set(p.username.trim().toLowerCase(), p);
          }

          // Active customer set
          const todayStr = new Date().toISOString().split('T')[0];
          const activeUserIds = new Set();
          for (const c of rawClaims) {
            if (c.claimdate && c.claimdate >= todayStr) activeUserIds.add(c.userId);
          }

          // Format Customers: referredby displays username
          const mappedCustomers = rawProfiles.map(p => {
            let refUser = 'Direct Registration';
            if (p.referredby && p.referredby.trim() && p.referredby.trim().toLowerCase() !== 'direct') {
              const raw = p.referredby.trim();
              const parent = profileMap.get(raw) || profileByCode.get(raw.toLowerCase()) || profileByName.get(raw.toLowerCase());
              refUser = parent ? parent.username : raw;
            }
            return {
              ...p,
              referredByUsername: refUser,
              hasActivePackage: activeUserIds.has(p.$id)
            };
          });
          setCustomers(mappedCustomers);

          // Deposits & Withdrawals sorted newest first
          setDeposits(rawDeposits.sort((a,b) => (b.$createdAt || '').localeCompare(a.$createdAt || '')));
          setWithdrawals(rawWithdraws.sort((a,b) => (b.$createdAt || '').localeCompare(a.$createdAt || '')));
          setRecipients(rawRecipients);
          if (rawSettings.length > 0 && rawSettings[0].grouplink) {
            setGroupLink(rawSettings[0].grouplink);
            setNewGroupLinkVal(rawSettings[0].grouplink);
          }

          // Ledger mapped with customer usernames
          const mappedLedger = rawLedger.map(l => ({
            ...l,
            customerUsername: profileMap.get(l.userId)?.username || l.userId
          })).sort((a,b) => (b.$createdAt || '').localeCompare(a.$createdAt || '')));
          setLedger(mappedLedger);

          // Commissions: Aggregated by user (1 entry per user who made >= 1 referral)
          const referrers = new Map();
          const getOrCreateReferrer = (refId, fallbackProf) => {
            if (!referrers.has(refId)) {
              const prof = profileMap.get(refId) || fallbackProf;
              referrers.set(refId, {
                userId: refId,
                username: prof?.username || refId,
                phone: prof?.phone || '—',
                code: prof?.referralcode || '—',
                referredUserIds: new Set(),
                referredNames: new Set(),
                profileCommissions: prof?.totalcommissions || 0,
                commissionDocSum: 0,
                status: 'credited',
                latestDate: prof?.$createdAt || new Date().toISOString(),
              });
            }
            return referrers.get(refId);
          };

          for (const p of rawProfiles) {
            if (p.referredby && p.referredby.trim() && p.referredby.trim().toLowerCase() !== 'direct') {
              const raw = p.referredby.trim();
              const parent = profileMap.get(raw) || profileByCode.get(raw.toLowerCase()) || profileByName.get(raw.toLowerCase());
              if (parent) {
                const entry = getOrCreateReferrer(parent.$id, parent);
                entry.referredUserIds.add(p.$id);
                entry.referredNames.add(p.username);
                if (p.$createdAt && p.$createdAt > entry.latestDate) entry.latestDate = p.$createdAt;
              }
            }
          }

          for (const c of rawCommissions) {
            const refUser = c.referreruserId;
            if (refUser) {
              const parent = profileMap.get(refUser);
              const entry = getOrCreateReferrer(refUser, parent);
              if (c.referreduserId) {
                entry.referredUserIds.add(c.referreduserId);
                const child = profileMap.get(c.referreduserId);
                entry.referredNames.add(child ? child.username : c.referreduserId);
              }
              entry.commissionDocSum += (c.commissionamount || 0);
              const date = c.creditedat || c.$createdAt;
              if (date && date > entry.latestDate) entry.latestDate = date;
            }
          }

          const aggregatedComm = [];
          for (const [id, r] of referrers.entries()) {
            const count = r.referredUserIds.size;
            if (count > 0) {
              const totalAmount = Math.max(r.profileCommissions, r.commissionDocSum);
              aggregatedComm.push({
                $id: `ref_entry_${id}`,
                userId: id,
                referrerUsername: r.username,
                referrerPhone: r.phone,
                referrerCode: r.code,
                referralsCount: count,
                referredCustomerNames: Array.from(r.referredNames),
                totalCommissions: totalAmount,
                status: r.status,
                latestDate: r.latestDate
              });
            }
          }
          setCommissions(aggregatedComm.sort((a,b) => b.totalCommissions - a.totalCommissions));

        } catch (err) {
          console.error('[SANYU SEASON Live Loader]', err);
          showToast('error', err.message || 'Could not refresh Appwrite data.');
        } finally {
          setIsLoading(false);
          setIsRefreshing(false);
        }
      }, []);

      useEffect(() => {
        loadAllData(true);
      }, [loadAllData]);

      // --- Financial Actions ---
      // Deposit Approval
      const handleApproveDeposit = async (deposit) => {
        try {
          // 1. Update deposit row in table 6aeda5230028db3b9821
          await db.updateRow(APPWRITE_CONFIG.tables.DEPOSITS, deposit.$id, {
            status: 'approved',
            reviewedat: new Date().toISOString(),
            reviewedby: ADMIN_ACCOUNT.id
          });
          // 2. Credit customer walletbalance in table 6aed9b4e000058a0927d
          const prof = customers.find(c => c.$id === deposit.userId);
          const currentBal = prof ? (prof.walletbalance || 0) : 0;
          const newBal = currentBal + (deposit.amount || 0);
          if (prof) {
            await db.updateRow(APPWRITE_CONFIG.tables.PROFILES, prof.$id, {
              walletbalance: newBal
            });
          }
          // 3. Create immutable ledger entry in table 6aeda35e000a97cee163
          await db.createRow(APPWRITE_CONFIG.tables.LEDGER, generateId(), {
            userId: deposit.userId,
            transactiontype: 'deposit',
            amount: deposit.amount,
            balancebefore: currentBal,
            balanceafter: newBal,
            refId: deposit.transactionId || deposit.requestreference || deposit.$id,
            status: 'completed'
          }).catch(() => {});

          showToast('success', `Deposit of ${formatUGX(deposit.amount)} approved.`);
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to approve deposit.');
        }
      };

      const handleRejectDeposit = async (deposit) => {
        try {
          await db.updateRow(APPWRITE_CONFIG.tables.DEPOSITS, deposit.$id, {
            status: 'rejected',
            reviewedat: new Date().toISOString(),
            reviewedby: ADMIN_ACCOUNT.id
          });
          showToast('info', `Deposit ${deposit.$id} marked rejected.`);
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to reject deposit.');
        }
      };

      // Withdrawal Approval
      const handleApproveWithdrawal = async (w) => {
        try {
          await db.updateRow(APPWRITE_CONFIG.tables.WITHDRAWS, w.$id, {
            status: 'paid',
            reviewedat: new Date().toISOString(),
            paidat: new Date().toISOString()
          });
          showToast('success', `Withdrawal of ${formatUGX(w.amount)} marked paid.`);
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to approve withdrawal.');
        }
      };

      const handleRejectWithdrawal = async (w) => {
        try {
          await db.updateRow(APPWRITE_CONFIG.tables.WITHDRAWS, w.$id, {
            status: 'rejected',
            reviewedat: new Date().toISOString()
          });
          // Refund customer availablebalance
          const prof = customers.find(c => c.$id === w.userId);
          if (prof) {
            const currentAvail = prof.availablebalance || 0;
            const newAvail = currentAvail + (w.amount || 0);
            await db.updateRow(APPWRITE_CONFIG.tables.PROFILES, prof.$id, {
              availablebalance: newAvail
            });
            await db.createRow(APPWRITE_CONFIG.tables.LEDGER, generateId(), {
              userId: prof.$id,
              transactiontype: 'withdrawal_refund',
              amount: w.amount,
              balancebefore: currentAvail,
              balanceafter: newAvail,
              refId: w.requestref || w.$id,
              status: 'completed'
            }).catch(() => {});
          }
          showToast('info', `Withdrawal ${w.$id} rejected and ${formatUGX(w.amount)} refunded to customer available balance.`);
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to reject withdrawal.');
        }
      };

      // Customer Wallet Adjustment (Accepts ANY value entered)
      const handleSaveWalletAdjustment = async (e) => {
        e.preventDefault();
        if (!editingWalletCustomer) return;
        const parsed = Number(walletAmount);
        if (isNaN(parsed) || walletAmount.trim() === '') {
          showToast('error', 'Please enter a valid amount.');
          return;
        }
        if (!walletReason.trim()) {
          showToast('error', 'An audit reason is required.');
          return;
        }
        setIsSavingWallet(true);
        try {
          const currentBal = editingWalletCustomer.walletbalance || 0;
          const newBal = walletType === 'add' ? currentBal + parsed : currentBal - parsed;

          // Update customer walletbalance in Appwrite
          await db.updateRow(APPWRITE_CONFIG.tables.PROFILES, editingWalletCustomer.$id, {
            walletbalance: newBal
          });

          // Write ledger entry
          await db.createRow(APPWRITE_CONFIG.tables.LEDGER, generateId(), {
            userId: editingWalletCustomer.$id,
            transactiontype: walletType === 'add' ? 'admin_wallet_credit' : 'admin_wallet_debit',
            amount: parsed,
            balancebefore: currentBal,
            balanceafter: newBal,
            refId: 'ADJ-' + Date.now().toString(36).toUpperCase(),
            status: 'completed'
          }).catch(() => {});

          showToast('success', `Wallet updated to ${formatUGX(newBal)}.`);
          setEditingWalletCustomer(null);
          setWalletAmount('');
          setWalletReason('');
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to adjust wallet balance.');
        } finally {
          setIsSavingWallet(false);
        }
      };

      // Toggle Customer Blocked
      const handleToggleBlock = async (c) => {
        const nextState = !c.isblocked;
        try {
          await db.updateRow(APPWRITE_CONFIG.tables.PROFILES, c.$id, {
            isblocked: nextState,
            status: nextState ? 'blocked' : 'active'
          });
          showToast('info', `Customer ${c.username} ${nextState ? 'blocked' : 'unblocked'}.`);
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to update customer block status.');
        }
      };

      // Save Group Link
      const handleSaveGroupLink = async () => {
        try {
          const settingsRows = await db.listRows(APPWRITE_CONFIG.tables.APP_SETTINGS);
          if (settingsRows.length > 0) {
            await db.updateRow(APPWRITE_CONFIG.tables.APP_SETTINGS, settingsRows[0].$id, {
              grouplink: newGroupLinkVal.trim(),
              updatedby: ADMIN_ACCOUNT.name
            });
          } else {
            await db.createRow(APPWRITE_CONFIG.tables.APP_SETTINGS, generateId(), {
              grouplink: newGroupLinkVal.trim(),
              updatedby: ADMIN_ACCOUNT.name,
              isactive: true
            });
          }
          setGroupLink(newGroupLinkVal.trim());
          setEditingGroupLink(false);
          showToast('success', 'SANYU SEASON group link updated.');
        } catch (err) {
          showToast('error', err.message || 'Failed to update group link.');
        }
      };

      // Recipient Management
      const handleToggleRecipient = async (r) => {
        try {
          const nextVal = String(r.isactive) === 'true' ? 'false' : 'true';
          await db.updateRow(APPWRITE_CONFIG.tables.PAYMENT_RECIPIENTS, r.$id, {
            isactive: nextVal
          });
          showToast('info', `Recipient ${r.name} status updated.`);
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to update recipient.');
        }
      };

      const handleAddRecipient = async (e) => {
        e.preventDefault();
        try {
          await db.createRow(APPWRITE_CONFIG.tables.PAYMENT_RECIPIENTS, generateId(), {
            name: recipientName.trim(),
            phonenumber: recipientPhone.trim(),
            network: recipientNetwork,
            isactive: 'true'
          });
          setNewRecipientModal(false);
          setRecipientName('');
          setRecipientPhone('');
          showToast('success', 'New payment recipient added.');
          await loadAllData(true);
        } catch (err) {
          showToast('error', err.message || 'Failed to create recipient.');
        }
      };

      // Download self as admin.html
      const handleDownloadSelf = () => {
        const html = document.documentElement.outerHTML;
        const blob = new Blob(['<!doctype html>\n' + html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'admin.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('success', 'admin.html downloaded.');
      };

      // Statistics calculations
      const pendingDepositsCount = deposits.filter(d => d.status === 'pending').length;
      const pendingWithdrawalsCount = withdrawals.filter(w => w.status === 'pending').length;
      const approvedDepositsTotal = deposits.filter(d => d.status === 'approved').reduce((sum, d) => sum + (d.amount || 0), 0);
      const approvedWithdrawalsGross = withdrawals.filter(w => w.status === 'paid').reduce((sum, w) => sum + (w.amount || 0), 0);
      const totalTaxDeductions = withdrawals.filter(w => w.status === 'paid').reduce((sum, w) => sum + (w.taxamount || Math.round((w.amount || 0) * 0.05)), 0);
      const approvedWithdrawalsNet = approvedWithdrawalsGross - totalTaxDeductions;
      const netDifference = approvedDepositsTotal - approvedWithdrawalsGross;
      const diffIsPositive = netDifference >= 0;

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Top Header */}
          <header className="sticky top-0 z-40 w-full bg-slate-900 border-b border-slate-800 text-slate-100 px-4 lg:px-8 py-3 transition-colors">
            <div className="flex items-center justify-between gap-4 max-w-7xl mx-auto">
              <div className="flex items-center gap-3 shrink-0">
                <span className="text-base font-bold tracking-tight text-white whitespace-nowrap">
                  SANYU SEASON
                </span>
                <span className="text-xs text-slate-400 font-mono hidden sm:inline">
                  Admin Panel
                </span>
              </div>

              {/* Live Sync, Theme, and Download Controls */}
              <div className="flex items-center gap-2 sm:gap-3 text-xs">
                <div className="flex items-center gap-1.5 text-slate-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="hidden sm:inline font-mono">Live Sync</span>
                </div>

                <button
                  type="button"
                  onClick={() => loadAllData(false)}
                  disabled={isRefreshing}
                  className="flex items-center gap-1.5 px-2.5 py-1 text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-md transition-colors font-medium disabled:opacity-50 cursor-pointer"
                  title="Sync with Appwrite TablesDB"
                >
                  <Icons.Refresh spin={isRefreshing} />
                  <span className="hidden md:inline">Sync Now</span>
                </button>

                <button
                  type="button"
                  onClick={handleDownloadSelf}
                  className="flex items-center gap-1.5 px-2.5 py-1 text-slate-950 font-bold bg-amber-500 hover:bg-amber-400 rounded-md transition-colors shadow-xs cursor-pointer"
                  title="Download standalone admin.html file to run anywhere"
                >
                  <Icons.Download />
                  <span className="hidden sm:inline">Download admin.html</span>
                </button>

                <button
                  type="button"
                  onClick={toggleTheme}
                  className="flex items-center gap-1.5 px-2.5 py-1 text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-md transition-colors font-medium cursor-pointer"
                  title="Toggle Light / Dark mode"
                >
                  {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
                </button>

                <div className="hidden lg:flex flex-col items-end text-right pl-2 border-l border-slate-800">
                  <span className="text-xs font-semibold text-slate-200">{currentUser.name}</span>
                  <span className="text-[11px] font-mono text-slate-400">{currentUser.phone}</span>
                </div>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-4 right-4 z-50 px-4 py-2.5 rounded-lg shadow-xl text-xs font-semibold text-white transition-all ${
              toast.type === 'success' ? 'bg-emerald-600' : toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-800 border border-slate-700'
            }`}>
              {toast.text}
            </div>
          )}

          {/* Main Layout */}
          <div className="flex-1 flex flex-col md:flex-row max-w-7xl w-full mx-auto">
            {/* Navigation Tabs: Exactly 8 sections in specified order */}
            <aside className="w-full md:w-60 shrink-0 p-4 border-b md:border-b-0 md:border-r border-slate-800 bg-slate-950/50">
              <nav className="flex md:flex-col gap-1.5 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
                {[
                  { id: 'dashboard', label: '1. Dashboard' },
                  { id: 'deposits', label: '2. Deposits', badge: pendingDepositsCount },
                  { id: 'withdrawals', label: '3. Withdrawals', badge: pendingWithdrawalsCount },
                  { id: 'customers', label: '4. Customers' },
                  { id: 'commissions', label: '5. Commissions' },
                  { id: 'recipients', label: '6. Recipient Number' },
                  { id: 'groupLink', label: '7. Group Link' },
                  { id: 'ledger', label: '8. Ledger' },
                ].map(item => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setActiveSection(item.id)}
                    className={`flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors cursor-pointer ${
                      activeSection === item.id
                        ? 'bg-amber-500 text-slate-950 shadow-xs'
                        : 'text-slate-300 hover:text-white hover:bg-slate-800/80'
                    }`}
                  >
                    <span>{item.label}</span>
                    {item.badge > 0 && (
                      <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-bold ml-2 ${
                        activeSection === item.id ? 'bg-slate-950 text-amber-400' : 'bg-amber-500 text-slate-950'
                      }`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 p-4 lg:p-8 overflow-y-auto">
              {isLoading ? (
                <div className="text-center py-20 text-slate-500 text-xs font-mono">
                  Loading real Appwrite database records...
                </div>
              ) : (
                <>
                  {/* SECTION 1: DASHBOARD */}
                  {activeSection === 'dashboard' && (
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
                        <div>
                          <h1 className="text-xl font-bold text-white tracking-tight">SANYU SEASON Operations Dashboard</h1>
                          <p className="text-xs text-slate-400 mt-1">
                            Real-time financial telemetry, customer metrics, and cash flow reconciliation.
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={handleDownloadSelf}
                          className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg transition-colors cursor-pointer w-fit"
                        >
                          <Icons.Download />
                          <span>Download Standalone admin.html</span>
                        </button>
                      </div>

                      {/* Top Metric Cards */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                          <div className="text-slate-400 text-xs font-medium">Total Customers</div>
                          <div className="text-2xl font-bold text-white font-mono mt-1">{customers.length}</div>
                          <div className="text-[11px] text-slate-500 mt-0.5">Registered Profiles</div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                          <div className="text-slate-400 text-xs font-medium">Approved Deposits</div>
                          <div className="text-2xl font-bold text-emerald-400 font-mono mt-1">{formatUGX(approvedDepositsTotal)}</div>
                          <div className="text-[11px] text-slate-500 mt-0.5">Verified Inflow</div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                          <div className="text-slate-400 text-xs font-medium">Approved Withdrawals</div>
                          <div className="text-2xl font-bold text-sky-400 font-mono mt-1">{formatUGX(approvedWithdrawalsGross)}</div>
                          <div className="text-[11px] text-slate-500 mt-0.5">Net Payout: {formatUGX(approvedWithdrawalsNet)} (Tax: {formatUGX(totalTaxDeductions)})</div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                          <div className="text-slate-400 text-xs font-medium">Net Financial Difference</div>
                          <div className={`text-2xl font-bold font-mono mt-1 ${diffIsPositive ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {diffIsPositive ? '+' : ''}{formatUGX(netDifference)}
                          </div>
                          <div className="text-[11px] text-slate-500 mt-0.5">
                            {diffIsPositive ? 'Positive Cashflow' : 'Negative Deficit'}
                          </div>
                        </div>
                      </div>

                      {/* Pending Attention Alerts */}
                      {(pendingDepositsCount > 0 || pendingWithdrawalsCount > 0) && (
                        <div className="flex flex-wrap gap-3">
                          {pendingDepositsCount > 0 && (
                            <button
                              type="button"
                              onClick={() => setActiveSection('deposits')}
                              className="flex items-center gap-2 px-3 py-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-300 text-xs font-semibold cursor-pointer"
                            >
                              <Icons.Clock />
                              <span>{pendingDepositsCount} Pending Deposit{pendingDepositsCount > 1 ? 's' : ''} require review</span>
                            </button>
                          )}
                          {pendingWithdrawalsCount > 0 && (
                            <button
                              type="button"
                              onClick={() => setActiveSection('withdrawals')}
                              className="flex items-center gap-2 px-3 py-2 bg-sky-500/10 border border-sky-500/30 rounded-lg text-sky-300 text-xs font-semibold cursor-pointer"
                            >
                              <Icons.Clock />
                              <span>{pendingWithdrawalsCount} Pending Withdrawal{pendingWithdrawalsCount > 1 ? 's' : ''} awaiting review</span>
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  {/* SECTION 2: DEPOSITS */}
                  {activeSection === 'deposits' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                        <div>
                          <h1 className="text-xl font-bold text-white tracking-tight">Deposit Requests</h1>
                          <p className="text-xs text-slate-400 mt-1">Appwrite table 6aeda5230028db3b9821</p>
                        </div>
                      </div>

                      <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900">
                        <table className="w-full text-left text-xs text-slate-200">
                          <thead className="bg-slate-950/70 border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase">
                            <tr>
                              <th className="py-3 px-4">Amount</th>
                              <th className="py-3 px-4">Payer Phone</th>
                              <th className="py-3 px-4">Network</th>
                              <th className="py-3 px-4">Reference</th>
                              <th className="py-3 px-4">Status</th>
                              <th className="py-3 px-4">Submitted</th>
                              <th className="py-3 px-4 text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 font-mono">
                            {deposits.map(d => (
                              <tr key={d.$id} className="hover:bg-slate-800/40">
                                <td className="py-3 px-4 font-bold text-emerald-400 text-sm font-sans">{formatUGX(d.amount)}</td>
                                <td className="py-3 px-4">{d.payerphone || '—'}</td>
                                <td className="py-3 px-4 font-sans">{d.network || '—'}</td>
                                <td className="py-3 px-4 text-[11px] text-slate-400">{d.requestreference || d.transactionId || d.$id}</td>
                                <td className="py-3 px-4 font-sans">
                                  <span className={`px-2 py-0.5 rounded-sm text-[11px] font-semibold capitalize ${
                                    d.status === 'approved' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800/60' :
                                    d.status === 'rejected' ? 'bg-rose-950 text-rose-300 border border-rose-800/60' :
                                    'bg-amber-950 text-amber-300 border border-amber-800/60'
                                  }`}>{d.status}</span>
                                </td>
                                <td className="py-3 px-4 text-[11px] text-slate-400 font-sans">{formatDate(d.submittedat || d.$createdAt)}</td>
                                <td className="py-3 px-4 text-right font-sans">
                                  {d.status === 'pending' && (
                                    <div className="flex items-center justify-end gap-1.5">
                                      <button
                                        type="button"
                                        onClick={() => handleApproveDeposit(d)}
                                        className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-semibold cursor-pointer"
                                      >
                                        Approve
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => handleRejectDeposit(d)}
                                        className="px-2.5 py-1 bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-800 rounded-md text-xs font-semibold cursor-pointer"
                                      >
                                        Reject
                                      </button>
                                    </div>
                                  )}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* SECTION 3: WITHDRAWALS */}
                  {activeSection === 'withdrawals' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                        <div>
                          <h1 className="text-xl font-bold text-white tracking-tight">Withdrawal Requests</h1>
                          <p className="text-xs text-slate-400 mt-1">Appwrite table 6aeda824000112246a87</p>
                        </div>
                      </div>

                      <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900">
                        <table className="w-full text-left text-xs text-slate-200">
                          <thead className="bg-slate-950/70 border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase">
                            <tr>
                              <th className="py-3 px-4">Gross Amount</th>
                              <th className="py-3 px-4">Tax (5%)</th>
                              <th className="py-3 px-4">Net Payout</th>
                              <th className="py-3 px-4">Phone</th>
                              <th className="py-3 px-4">Status</th>
                              <th className="py-3 px-4">Requested</th>
                              <th className="py-3 px-4 text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 font-mono">
                            {withdrawals.map(w => (
                              <tr key={w.$id} className="hover:bg-slate-800/40">
                                <td className="py-3 px-4 font-bold text-white">{formatUGX(w.amount)}</td>
                                <td className="py-3 px-4 text-rose-400 font-sans">-{formatUGX(w.taxamount || Math.round((w.amount||0)*0.05))}</td>
                                <td className="py-3 px-4 text-emerald-400 font-bold">{formatUGX(w.netamount || ((w.amount||0) - Math.round((w.amount||0)*0.05)))}</td>

                      type="button"
                      onClick={() => setWalletType('subtract')}
                      className={`flex items-center justify-center gap-1.5 py-2 text-xs font-semibold rounded-lg border cursor-pointer ${
                        walletType === 'subtract' ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-800 text-slate-300 border-slate-700'
                      }`}
                    >
                      <Icons.Minus /> <span>Subtract Debit</span>
                    </button>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      Adjustment Amount (UGX) <span className="text-rose-400">* Accepts any value</span>
                    </label>
                    <input
                      type="number"
                      step="any"
                      value={walletAmount}
                      onChange={(e) => setWalletAmount(e.target.value)}
                      placeholder="Enter any amount"
                      required
                      className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-200 placeholder:text-slate-600 focus:outline-hidden focus:border-amber-500 font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      Audit Reason <span className="text-rose-400">*</span>
                    </label>
                    <input
                      type="text"
                      value={walletReason}
                      onChange={(e) => setWalletReason(e.target.value)}
                      placeholder="e.g. Authorized balance adjustment"
                      required
                      className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-200 placeholder:text-slate-600 focus:outline-hidden focus:border-amber-500"
                    />
                  </div>

                  <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs flex justify-between items-center">
                    <span className="text-slate-400">Resulting Balance:</span>
                    <strong className="text-amber-400 font-mono text-sm">
                      {formatUGX(
                        walletAmount && !isNaN(Number(walletAmount))
                          ? (walletType === 'add'
                              ? (editingWalletCustomer.walletbalance || 0) + Number(walletAmount)
                              : (editingWalletCustomer.walletbalance || 0) - Number(walletAmount))
                          : (editingWalletCustomer.walletbalance || 0)
                      )}
                    </strong>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setEditingWalletCustomer(null)}
                      className="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 rounded-lg cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isSavingWallet || !walletAmount.trim() || isNaN(Number(walletAmount)) || !walletReason.trim()}
                      className="px-4 py-1.5 text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg transition-colors cursor-pointer disabled:opacity-50"
                    >
                      {isSavingWallet ? 'Saving...' : 'Save New Balance'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Recipient Modal */}
          {newRecipientModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-xs">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-5 text-slate-100 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Add New Deposit Payment Recipient</h3>
                  <button type="button" onClick={() => setNewRecipientModal(false)} className="text-slate-400 hover:text-white">
                    <Icons.X />
                  </button>
                </div>

                <form onSubmit={handleAddRecipient} className="space-y-4 mt-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Recipient Name</label>
                    <input
                      type="text"
                      value={recipientName}
                      onChange={(e) => setRecipientName(e.target.value)}
                      placeholder="e.g. SANYU TREASURY 1"
                      required
                      className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-hidden focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Phone Number</label>
                    <input
                      type="text"
                      value={recipientPhone}
                      onChange={(e) => setRecipientPhone(e.target.value)}
                      placeholder="e.g. +256700000000"
                      required
                      className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-hidden focus:border-amber-500 font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Network Provider</label>
                    <select
                      value={recipientNetwork}
                      onChange={(e) => setRecipientNetwork(e.target.value)}
                      className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-hidden focus:border-amber-500"
                    >
                      <option value="MTN">MTN Uganda</option>
                      <option value="AIRTEL">Airtel Uganda</option>
                    </select>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setNewRecipientModal(false)}
                      className="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 rounded-lg cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg cursor-pointer"
                    >
                      Add Recipient
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
